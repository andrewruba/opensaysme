name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:native
      - name: Test native helpers without desktop capture or input
        run: sh native/macos/test.sh
      - name: Read-only doctor smoke test
        run: node dist/cli.js doctor --json
