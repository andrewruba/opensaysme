name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:native
      - name: Test macOS audio, pointer, and image encoding without desktop capture
        if: runner.os == 'macOS'
        run: sh native/macos/test.sh
      - name: Compile Windows helper and parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -Path ./native/windows/input.cs
          ./native/windows/test-voice.ps1
          foreach ($file in Get-ChildItem ./native/windows/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell parser errors in $($file.Name)" }
          }
      - name: Read-only doctor smoke test
        run: node dist/cli.js doctor --json
      - name: Check package contents
        run: npm pack --dry-run
  linux-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build virtual desktop test image
        run: docker build -f scripts/Dockerfile.x11 -t opensaysme-x11-test .
      - name: Exercise X11 without touching a physical desktop
        run: docker run --rm --init --network none opensaysme-x11-test
